<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<title>NiM — Messages</title>
<style>
:root {
  --bg:#0b0a12;
  --glass:rgba(30,27,43,.76);
  --line:rgba(255,255,255,.09);
  --purple:#a56bff;
  --pink:#e16bff;
  --text:#faf8ff;
  --muted:#a6a1b6;
}
* { box-sizing:border-box; }
body {
  margin:0;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 15% 0%,#39205a 0,transparent 42%),
    radial-gradient(ellipse at 100% 80%,#241441 0,transparent 35%),
    var(--bg);
  min-height:100dvh;
}
button,input { font:inherit; }
button { cursor:pointer; }
.app {
  width:100%;
  max-width:620px;
  height:100dvh;
  min-height:450px;
  margin:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:rgba(10,9,17,.22);
  border-left:1px solid rgba(255,255,255,.04);
  border-right:1px solid rgba(255,255,255,.04);
}
.top {
  padding:calc(env(safe-area-inset-top) + 12px) 18px 14px;
  background:rgba(20,17,30,.65);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--line);
}
.brandrow,.person,.composer,.tools {
  display:flex;
  align-items:center;
  gap:12px;
}
.brandrow { justify-content:space-between; }
.logo {
  width:43px;height:43px;border-radius:15px;
  display:grid;place-items:center;
  font-size:21px;font-weight:900;
  background:linear-gradient(135deg,#8b5cf6,#ec68e9);
  box-shadow:0 4px 24px #a35aff40;
}
.brand { font-size:21px;font-weight:800;letter-spacing:-.8px; }
.premium { color:#d8b5ff;font-size:10px;letter-spacing:2px; }
.personrow {
  display:flex;justify-content:space-between;align-items:center;
  margin-top:17px;
}
.person { min-width:0; }
.avatar {
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  font-size:17px;font-weight:700;flex-shrink:0;
  background:linear-gradient(145deg,#9d6aff,#ef83d9);
  color:white;box-shadow:0 0 22px #ad67ff22;
}
.personname { font-weight:700;font-size:15px; }
.online { font-size:12px;color:#9be7b1;margin-top:4px; }
.pill {
  border:1px solid var(--line);border-radius:20px;
  padding:9px 12px;background:#ffffff09;color:#e8d8ff;
  font-size:12px;
}
#login {
  padding:22px 18px;
  display:flex;flex-direction:column;gap:11px;
}
.heading { font-size:26px;font-weight:800;letter-spacing:-1px; }
.sub { color:var(--muted);font-size:13px;line-height:1.5; }
.field {
  width:100%;padding:15px;border-radius:15px;
  color:white;background:#ffffff08;border:1px solid var(--line);
  outline:none;
}
.field:focus { border-color:#b36bff; }
.primary {
  border:0;color:white;font-weight:750;
  padding:15px;border-radius:15px;
  background:linear-gradient(110deg,#8758f4,#d65de7);
  box-shadow:0 8px 28px #9a51ff25;
}
#status { color:#cdb9f0;font-size:12px; }
#chat { display:none;flex:1;min-height:0;flex-direction:column; }
#messages {
  flex:1;min-height:0;overflow-y:auto;
  padding:20px 15px 12px;
  display:flex;flex-direction:column;gap:9px;
  scroll-behavior:smooth;
}
.day {
  text-align:center;color:#aaa4b9;font-size:11px;
  margin:2px 0 12px;
}
.line { display:flex;flex-direction:column;max-width:84%; }
.line.mine { align-self:flex-end;align-items:flex-end; }
.line.theirs { align-self:flex-start;align-items:flex-start; }
.bubble {
  border:1px solid #ffffff0c;
  border-radius:21px;
  padding:11px 15px;
  font-size:15px;line-height:1.4;
  overflow-wrap:anywhere;white-space:pre-wrap;
  box-shadow:0 3px 15px #00000013;
}
.mine .bubble {
  background:linear-gradient(140deg,#a45df6,#d35ee8);
  border-bottom-right-radius:7px;
  color:white;
}
.theirs .bubble {
  background:rgba(57,53,70,.83);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border-bottom-left-radius:7px;
}
.sender { font-size:11px;color:#c4a8fa;margin:0 9px 5px; }
.time { color:#9992ac;font-size:10px;margin:4px 7px 0; }
.photo {
  display:block;width:min(240px,65vw);max-height:300px;
  object-fit:cover;border-radius:15px;
}
.photoButton {
  width:43px;height:43px;border-radius:50%;
  background:#ffffff0b;border:1px solid var(--line);
  color:#e8d5ff;font-size:23px;flex-shrink:0;
}
.composerWrap {
  padding:12px 13px calc(env(safe-area-inset-bottom) + 12px);
  background:rgba(20,17,30,.78);
  border-top:1px solid var(--line);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}
.composer {
  border:1px solid #ffffff13;background:#ffffff08;
  border-radius:25px;padding:5px 6px 5px 14px;
}
.composer input {
  min-width:0;flex:1;border:0;outline:0;background:transparent;
  color:white;padding:10px 0;
}
.composer input::placeholder { color:#938ba5; }
.send {
  width:39px;height:39px;border:0;border-radius:50%;
  background:linear-gradient(135deg,#9862ff,#e067ed);
  color:white;font-size:18px;font-weight:800;flex-shrink:0;
}
.hint { text-align:center;color:#777187;font-size:10px;margin-top:8px; }
#imageInput { display:none; }
.system { align-self:center;color:#9991ab;font-size:11px;padding:7px; }
@media(min-width:621px) {
  body { padding:20px 0; }
  .app { height:calc(100dvh - 40px);border-radius:28px;border:1px solid var(--line); }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brandrow">
      <div class="brandrow">
        <div class="logo">N</div>
        <div>
          <div class="brand">NiM <span style="color:#cf9aff">Chat</span></div>
          <div class="premium">MESSAGES · PREMIUM</div>
        </div>
      </div>
      <button class="pill" id="leaveTop" type="button" style="display:none">Quitter ↗</button>
    </div>
    <div class="personrow" id="personrow" style="display:none">
      <div class="person">
        <div class="avatar" id="avatar">N</div>
        <div>
          <div class="personname" id="roomTitle">Salon NiM</div>
          <div class="online" id="connection">● Connecté</div>
        </div>
      </div>
      <div class="pill">🔒 Salon de test</div>
    </div>
  </header>

  <section id="login">
    <div class="heading">Tes messages.<br>Ton univers.</div>
    <div class="sub">Retrouve tes amis dans une conversation NiM en direct.</div>
    <input class="field" id="name" maxlength="20" placeholder="Ton pseudo">
    <input class="field" id="room" maxlength="24" placeholder="Code du salon (4 caractères min.)">
    <button class="primary" id="join">Rejoindre NiM ↗</button>
    <div id="status">Connexion au serveur…</div>
  </section>

  <section id="chat">
    <div id="messages">
      <div class="day">VOS MESSAGES S'AFFICHERONT ICI</div>
    </div>
    <div class="composerWrap">
      <form class="composer" id="sendForm">
        <button type="button" class="photoButton" id="photoButton" aria-label="Ajouter une photo">＋</button>
        <input id="text" maxlength="500" placeholder="iMessage…" autocomplete="off">
        <button type="submit" class="send" aria-label="Envoyer">↑</button>
      </form>
      <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp">
      <div class="hint">NiM Chat · des conversations qui te ressemblent</div>
    </div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = id => document.getElementById(id);
let joined = false;
let myName = "";

socket.on("connect", () => {
  $("status").textContent = "Serveur connecté ✓";
  $("connection").textContent = "● Connecté";
});

socket.on("disconnect", () => {
  joined = false;
  $("login").style.display = "flex";
  $("chat").style.display = "none";
  $("personrow").style.display = "none";
  $("leaveTop").style.display = "none";
  $("status").textContent = "Connexion perdue. Reconnecte-toi.";
  $("connection").textContent = "● Déconnecté";
});

$("join").onclick = () => {
  const name = $("name").value.trim();
  const room = $("room").value.trim().toLowerCase();

  if (!name || !/^[a-z0-9_-]{4,24}$/.test(room)) {
    $("status").textContent = "Entre un pseudo et un code de salon valide.";
    return;
  }
  if (!socket.connected) {
    $("status").textContent = "Le serveur n'est pas connecté.";
    return;
  }
  myName = name;
  socket.emit("join-room", {name, room});
  $("status").textContent = "Connexion au salon…";
};

socket.on("joined", name => {
  joined = true;
  $("login").style.display = "none";
  $("chat").style.display = "flex";
  $("personrow").style.display = "flex";
  $("leaveTop").style.display = "block";
  $("roomTitle").textContent = $("room").value.trim();
  $("avatar").textContent = name.charAt(0).toUpperCase();
});

socket.on("error-message", text => $("status").textContent = text);

socket.on("history", history => {
  $("messages").replaceChildren();
  if (!history.length) {
    addSystem("Début de votre conversation ✨");
  } else {
    history.forEach(addMessage);
  }
});

socket.on("chat-message", addMessage);

function addSystem(text) {
  const el = document.createElement("div");
  el.className = "system";
  el.textContent = text;
  $("messages").appendChild(el);
}

function addMessage(message) {
  const box = $("messages");
  if (message.type === "system") {
    addSystem(message.text);
    box.scrollTop = box.scrollHeight;
    return;
  }

  const mine = message.name === myName;
  const line = document.createElement("div");
  line.className = "line " + (mine ? "mine" : "theirs");

  if (!mine) {
    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = message.name;
    line.appendChild(sender);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (message.type === "image" && message.image) {
    const img = document.createElement("img");
    img.className = "photo";
    img.src = message.image;
    img.alt = "Photo envoyée dans NiM Chat";
    img.loading = "lazy";
    bubble.appendChild(img);
  } else {
    bubble.textContent = message.text || "";
  }

  line.appendChild(bubble);

  if (message.time) {
    const time = document.createElement("div");
    time.className = "time";
    const date = new Date(message.time);
    time.textContent = date.toLocaleTimeString("fr-FR", {
      hour: "2-digit", minute: "2-digit"
    });
    line.appendChild(time);
  }

  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

$("sendForm").onsubmit = event => {
  event.preventDefault();
  const text = $("text").value.trim();
  if (!joined || !text) return;
  socket.emit("send-message", {type: "text", text});
  $("text").value = "";
};

$("photoButton").onclick = () => {
  if (!joined) return;
  $("imageInput").click();
};

$("imageInput").onchange = async () => {
  const file = $("imageInput").files[0];
  $("imageInput").value = "";
  if (!file || !joined) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Choisis une image JPG, PNG ou WebP.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("Cette photo dépasse 5 Mo. Choisis une photo plus légère.");
    return;
  }

  try {
    const image = await compressImage(file);
    socket.emit("send-message", {type: "image", image});
  } catch {
    alert("Impossible de préparer cette image.");
  }
};

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, 900 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.68));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function leaveChat() {
  location.reload();
}
$("leaveTop").onclick = leaveChat;
</script>
</body>
</html>
