
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10091d">
<title>NiM — Next is Me</title>
<style>
:root{--bg:#0c0714;--panel:#191025;--pink:#ff4fbd;--purple:#9657ff;--text:#fff;--muted:#bcaecb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#30134a,#10091b 55%,#09060e);color:var(--text);font-family:system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer;color:white}
button:disabled{opacity:.5}
.hidden{display:none!important}
.app{max-width:850px;margin:auto;min-height:100dvh;padding:16px;display:flex;flex-direction:column}
.brand{font-size:38px;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#fff,var(--pink),var(--purple));background-clip:text;color:transparent}
.subtitle,.note{color:var(--muted)}
.panel{background:#191025;border:1px solid #ffffff17;border-radius:20px}
#home{margin:auto 0;padding:24px}
.field{display:block;margin:16px 0;color:var(--muted);font-size:14px}
.field input{display:block;width:100%;padding:14px;margin-top:7px;background:#0d0814;color:white;border:1px solid #ffffff20;border-radius:13px}
.primary{padding:13px 17px;border:0;border-radius:14px;background:linear-gradient(100deg,var(--purple),var(--pink));font-weight:750}
.full{width:100%;margin-top:8px}
.note{font-size:12px;margin-top:15px}
#chat{flex:1;min-height:0;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:12px;margin:12px 0}
.room-title{flex:1;min-width:0;overflow-wrap:anywhere}
.room-title small{display:block;color:var(--muted)}
.round{min-height:42px;min-width:42px;border-radius:12px;border:1px solid #ffffff20;background:#281938;padding:8px}
#messages{min-height:230px;flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.message{max-width:90%;align-self:flex-start;overflow-wrap:anywhere;background:#271832;border-radius:15px;padding:11px 13px}
.message.mine{align-self:flex-end;background:linear-gradient(135deg,#5733a0,#7b286f)}
.meta{font-size:11px;color:#ddcde9;margin-bottom:5px}
.body{white-space:pre-wrap}
.message img{display:block;max-width:100%;max-height:350px;border-radius:10px}
.message audio{display:block;width:250px;max-width:100%}
.system{text-align:center;color:var(--muted);font-size:12px}
.composer{display:flex;align-items:center;gap:6px;padding:8px;margin-top:10px}
#messageInput{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid #ffffff20;background:#0d0814;color:white}
#callPanel{padding:15px;text-align:center;margin-bottom:10px}
#callStatus{font-size:13px;margin:12px 0;color:#f1d7ff}
#remoteAudios audio{width:100%;margin-top:8px}
#toast{position:fixed;bottom:20px;left:5%;width:90%;background:#2b1a3d;border:1px solid #ffffff30;padding:12px;border-radius:14px;z-index:9;text-align:center}
@media(max-width:500px){.app{padding:10px}#home{padding:18px}.brand{font-size:34px}.composer{gap:4px;padding:6px 3px}.round{min-width:36px}.message audio{width:220px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">NiM.</div>
  <div class="subtitle">Next is Me · connecte-toi à tes potes.</div>
</header>

<section id="home" class="panel">
  <h2>Entre dans NiM ✨</h2>
  <p class="subtitle">Rejoins un salon pour discuter.</p>
  <form id="joinForm">
    <label class="field">Ton pseudo
      <input id="nameInput" maxlength="24" placeholder="Ex. Lolo" required>
    </label>
    <label class="field">Nom du salon
      <input id="roomInput" maxlength="40" value="general" required>
    </label>
    <button id="joinButton" class="primary full" type="submit">Entrer dans NiM →</button>
  </form>
  <p class="note">Tes amis doivent utiliser exactement le même nom de salon.</p>
</section>

<section id="chat" class="hidden">
  <div class="topbar panel">
    <button id="backButton" class="round" type="button">←</button>
    <div class="room-title"><strong id="roomLabel">Salon</strong><small id="nameLabel"></small></div>
    <button id="callButton" class="primary" type="button">📞 Appel</button>
  </div>

  <section id="callPanel" class="panel hidden">
    <strong>📞 Appel audio</strong>
    <div id="callStatus">Prêt à rejoindre</div>
    <button id="joinCallButton" class="primary" type="button">Rejoindre l'appel</button>
    <button id="muteButton" class="round hidden" type="button">🔇 Couper le micro</button>
    <button id="hangupButton" class="round hidden" type="button">Raccrocher</button>
    <div id="remoteAudios"></div>
  </section>

  <div id="messages" class="panel" aria-live="polite"></div>
  <div id="recordStatus" class="note"></div>
  <form id="messageForm" class="composer panel">
    <button id="photoButton" class="round" type="button">🖼️</button>
    <input id="photoInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp">
    <button id="recordButton" class="round" type="button">🎙️</button>
    <input id="messageInput" maxlength="2000" placeholder="Écris un message…" autocomplete="off">
    <button class="primary" type="submit">➤</button>
  </form>
</section>
</div>
<div id="toast" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const socket = io();
  let myName = "", myRoom = "", joined = false, pending = false;
  let joinTimer, recorder = null, recordStream = null, recordChunks = [];
  let recordTimer, localStream = null, inCall = false, muted = false;
  const peers = new Map(), queues = new Map();

  function toast(message) {
    $("toast").textContent = message;
    $("toast").classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => $("toast").classList.add("hidden"), 3500);
  }

  function resetJoin() {
    pending = false;
    clearTimeout(joinTimer);
    $("joinButton").disabled = false;
    $("joinButton").textContent = "Entrer dans NiM →";
  }

  function requestJoin() {
    if (myName && myRoom && socket.connected && pending) {
      socket.emit("join-room", {name: myName, room: myRoom});
    }
  }

  $("joinForm").addEventListener("submit", event => {
    event.preventDefault();
    if (pending) return;

    const name = $("nameInput").value.trim().slice(0, 24);
    const room = $("roomInput").value.trim().slice(0, 40);

    if (!name) return toast("Entre un pseudo.");
    if (!/^[a-zA-Z0-9_-]{1,40}$/.test(room)) {
      return toast("Le salon accepte lettres, chiffres, _ et -.");
    }

    myName = name;
    myRoom = room;
    pending = true;
    joined = false;
    $("joinButton").disabled = true;
    $("joinButton").textContent = "Connexion…";

    if (socket.connected) requestJoin();
    else socket.connect();

    clearTimeout(joinTimer);
    joinTimer = setTimeout(() => {
      if (pending && !joined) {
        resetJoin();
        toast("Le serveur ne répond pas. Réessaie.");
      }
    }, 12000);
  });

  socket.on("connect", requestJoin);
  socket.on("connect_error", () => {
    if (pending) {
      resetJoin();
      toast("Connexion au serveur impossible. Réessaie.");
    }
  });

  socket.on("joined", data => {
    clearTimeout(joinTimer);
    if (data?.name) myName = data.name;
    if (data?.room) myRoom = data.room;
    pending = false;
    joined = true;
    $("home").classList.add("hidden");
    $("chat").classList.remove("hidden");
    $("chat").style.display = "flex";
    $("roomLabel").textContent = "#" + myRoom;
    $("nameLabel").textContent = "Connecté en tant que " + myName;
    resetJoin();
  });

  socket.on("join-error", message => {
    resetJoin();
    toast(message || "Impossible de rejoindre le salon.");
  });

  socket.on("history", list => {
    $("messages").replaceChildren();
    (list || []).forEach(renderMessage);
    scrollBottom();
  });

  socket.on("new-message", message => {
    renderMessage(message);
    scrollBottom();
  });

  function scrollBottom() {
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function renderMessage(msg) {
    if (!msg) return;
    const el = document.createElement("div");
    if (msg.type === "system") {
      el.className = "system";
      el.textContent = msg.text || "";
      $("messages").appendChild(el);
      return;
    }

    el.className = "message" + (msg.name === myName ? " mine" : "");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (msg.name || "Membre") + " · " +
      new Date(msg.time || Date.now()).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    el.appendChild(meta);

    if (msg.type === "text") {
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = msg.text || "";
      el.appendChild(body);
    } else if (msg.type === "image" && msg.image) {
      const img = document.createElement("img");
      img.src = msg.image;
      img.alt = "Photo envoyée";
      el.appendChild(img);
    } else if (msg.type === "audio" && msg.audio) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "metadata";
      audio.src = msg.audio;
      el.appendChild(audio);
    }
    $("messages").appendChild(el);
  }

  $("messageForm").addEventListener("submit", event => {
    event.preventDefault();
    if (!joined || !socket.connected) return toast("Rejoins d'abord un salon.");
    const text = $("messageInput").value.trim();
    if (!text) return;
    socket.emit("send-message", {type:"text", text});
    $("messageInput").value = "";
  });

  $("photoButton").addEventListener("click", () => $("photoInput").click());

  $("photoInput").addEventListener("change", async () => {
    const file = $("photoInput").files?.[0];
    $("photoInput").value = "";
    if (!file || !joined) return;
    try {
      const data = await compressPhoto(file);
      if (data.length > 740000) return toast("Photo trop lourde. Choisis-en une plus petite.");
      socket.emit("send-message", {type:"image", image:data});
    } catch {
      toast("Impossible de charger cette photo.");
    }
  });

  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function blobDataURL(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  }

  $("recordButton").addEventListener("click", async () => {
    if (recorder?.state === "recording") {
      recorder.stop();
      return;
    }
    if (!joined) return toast("Rejoins d'abord un salon.");
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      return toast("Enregistrement audio non pris en charge.");
    }

    try {
      recordStream = await navigator.mediaDevices.getUserMedia({audio:true});
      const formats = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
      const format = formats.find(f => MediaRecorder.isTypeSupported?.(f));
      recorder = format ? new MediaRecorder(recordStream, {mimeType:format}) : new MediaRecorder(recordStream);
      recordChunks = [];

      recorder.ondataavailable = e => {
        if (e.data?.size) recordChunks.push(e.data);
      };

      recorder.onstop = async () => {
        clearTimeout(recordTimer);
        $("recordStatus").textContent = "";
        $("recordButton").textContent = "🎙️";
        recordStream?.getTracks().forEach(t => t.stop());
        recordStream = null;

        try {
          if (!recordChunks.length) return toast("Vocal vide. Réessaie.");
          const blob = new Blob(recordChunks, {type:recorder.mimeType || "audio/webm"});
          const data = await blobDataURL(blob);
          if (data.length > 740000) return toast("Vocal trop lourd. Fais un vocal plus court.");
          socket.emit("send-message", {type:"audio", audio:data});
        } catch {
          toast("Impossible d'envoyer ce vocal.");
        }
      };

      recorder.start();
      $("recordButton").textContent = "⏹️";
      $("recordStatus").textContent = "🔴 Enregistrement · 15 secondes maximum";
      recordTimer = setTimeout(() => {
        if (recorder?.state === "recording") recorder.stop();
      }, 15000);
    } catch {
      toast("Autorise le micro dans les paramètres du navigateur.");
    }
  });

  $("backButton").addEventListener("click", () => {
    if (inCall) stopCall();
    joined = false;
    $("chat").classList.add("hidden");
    $("chat").style.display = "none";
    $("home").classList.remove("hidden");
  });

  $("callButton").addEventListener("click", () => {
    $("callPanel").classList.toggle("hidden");
  });
  $("joinCallButton").addEventListener("click", startCall);
  $("hangupButton").addEventListener("click", stopCall);

  $("muteButton").addEventListener("click", () => {
    if (!localStream) return;
    muted = !muted;
    localStream.getAudioTracks().forEach(t => t.enabled = !muted);
    $("muteButton").textContent = muted ? "🎙️ Activer le micro" : "🔇 Couper le micro";
  });

  async function startCall() {
    if (inCall || !joined) return;
    if (!navigator.mediaDevices?.getUserMedia) {
      return toast("L'appel nécessite HTTPS et l'autorisation du micro.");
    }
    $("joinCallButton").disabled = true;
    $("callStatus").textContent = "Demande d'accès au micro…";

    try {
      localStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
      inCall = true;
      muted = false;
      $("joinCallButton").classList.add("hidden");
      $("muteButton").classList.remove("hidden");
      $("hangupButton").classList.remove("hidden");
      $("callStatus").textContent = "Connexion à l'appel…";
      socket.emit("voice-join");
    } catch {
      $("callStatus").textContent = "Micro indisponible.";
      toast("Autorise le micro pour lancer l'appel.");
    } finally {
      $("joinCallButton").disabled = false;
    }
  }

  function getPeer(id) {
    if (peers.has(id)) return peers.get(id);
    const pc = new RTCPeerConnection({
      iceServers:[{urls:"stun:stun.l.google.com:19302"}]
    });
    localStream?.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = e => {
      if (e.candidate) socket.emit("voice-signal", {to:id, signal:{candidate:e.candidate}});
    };

    pc.ontrack = e => {
      let audio = $("remote-" + id);
      if (!audio) {
        audio = document.createElement("audio");
        audio.id = "remote-" + id;
        audio.autoplay = true;
        audio.controls = true;
        $("remoteAudios").appendChild(audio);
      }
      if (e.streams?.[0]) {
        audio.srcObject = e.streams[0];
        audio.play().catch(() => $("callStatus").textContent = "Appuie sur lecture pour activer le son.");
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") $("callStatus").textContent = "🟢 Appel audio connecté";
      if (pc.connectionState === "failed") $("callStatus").textContent = "Connexion audio échouée. Essaie un autre réseau.";
    };

    peers.set(id, pc);
    queues.set(id, []);
    return pc;
  }

  async function offerTo(id) {
    try {
      const pc = getPeer(id);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("voice-signal", {to:id, signal:{description:pc.localDescription}});
    } catch (e) {
      console.error("Appel audio :", e);
    }
  }

  socket.on("voice-peers", async ids => {
    if (!inCall) return;
    for (const id of ids || []) await offerTo(id);
    if (!ids?.length) $("callStatus").textContent = "En attente d'un autre membre…";
  });

  socket.on("voice-peer-joined", () => {
    if (inCall) $("callStatus").textContent = "Un membre rejoint l'appel…";
  });

  socket.on("voice-signal", async ({from, signal} = {}) => {
    if (!inCall || !from || !signal) return;
    try {
      const pc = getPeer(from);
      if (signal.description) {
        await pc.setRemoteDescription(signal.description);
        for (const candidate of queues.get(from) || []) {
          try { await pc.addIceCandidate(candidate); } catch {}
        }
        queues.set(from, []);
        if (signal.description.type === "offer") {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit("voice-signal", {to:from, signal:{description:pc.localDescription}});
        }
      } else if (signal.candidate) {
        if (pc.remoteDescription) await pc.addIceCandidate(signal.candidate);
        else queues.get(from)?.push(signal.candidate);
      }
    } catch (e) {
      console.error("Signal audio :", e);
    }
  });

  socket.on("voice-peer-left", closePeer);

  function closePeer(id) {
    peers.get(id)?.close();
    peers.delete(id);
    queues.delete(id);
    const audio = $("remote-" + id);
    if (audio) audio.remove();
  }

  function stopCall() {
    if (inCall) socket.emit("voice-leave");
    inCall = false;
    peers.forEach((pc, id) => closePeer(id));
    localStream?.getTracks().forEach(t => t.stop());
    localStream = null;
    $("remoteAudios").replaceChildren();
    $("joinCallButton").classList.remove("hidden");
    $("muteButton").classList.add("hidden");
    $("hangupButton").classList.add("hidden");
    $("callStatus").textContent = "Appel terminé.";
  }

  window.addEventListener("beforeunload", stopCall);
})();
</script>
</body>
</html>
