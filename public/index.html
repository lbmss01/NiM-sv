
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b19">
<title>NiM — Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b19;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#21152e;position:sticky;top:0;z-index:2;border-bottom:1px solid #49335b}
h1{margin:0;color:#d9a4ff;font-size:25px}
header p{margin:5px 0 0;color:#c4b5d0;font-size:13px}
main{max-width:700px;margin:auto;padding:14px}
.panel{background:#21182c;border:1px solid #453251;border-radius:18px;padding:15px;margin-bottom:14px}
input,button{font:inherit}
input{background:#130e1b;color:white;border:1px solid #51405f;border-radius:12px;padding:13px;width:100%;margin:5px 0 12px}
button{background:#a45be8;color:white;border:0;border-radius:12px;padding:12px;cursor:pointer}
button:disabled{opacity:.5}
.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row button{flex-shrink:0}
#messages{height:45vh;min-height:240px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{background:#342542;border-radius:14px;padding:10px;max-width:90%;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:#633b83}
.name{font-size:11px;color:#e5b9ff;margin-bottom:5px}
.time{font-size:10px;color:#c7b8d2;text-align:right;margin-top:5px}
.system{text-align:center;color:#c5b1d5;font-size:12px}
.msg img,.msg video{max-width:100%;border-radius:10px}
.msg audio{max-width:100%;width:240px}
.muted{font-size:12px;color:#c2b4ce}
#toast{position:fixed;bottom:20px;left:5%;width:90%;text-align:center;background:#49315b;padding:12px;border-radius:12px;display:none;z-index:5}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>NiM ✦</h1>
  <p id="status">Connexion au serveur…</p>
</header>
<main>
  <section id="login" class="panel">
    <h3>Rejoindre un salon</h3>
    <form id="joinForm">
      <label for="pseudo">Ton pseudo</label>
      <input id="pseudo" maxlength="24" placeholder="Ex. Lolo" required>
      <label for="room">Nom du salon</label>
      <input id="room" maxlength="40" value="general" pattern="[a-zA-Z0-9_-]+" required>
      <button class="wide" type="submit">Entrer dans le chat</button>
    </form>
    <p class="muted">Donne le même nom de salon à tes potes pour discuter ensemble.</p>
  </section>

  <section id="chat" class="hidden">
    <div class="panel">
      <div class="row">
        <div style="flex:1">
          <strong id="roomTitle">Salon</strong>
          <p id="people" class="muted">0 personne</p>
        </div>
        <button id="callBtn">📞 Appeler</button>
        <button id="leaveBtn">Quitter</button>
      </div>
      <div id="callPanel" class="hidden">
        <p id="callStatus" class="muted">Appel audio</p>
        <button id="muteBtn">Couper micro</button>
        <button id="hangBtn">Raccrocher</button>
        <div id="remoteAudio"></div>
      </div>
    </div>

    <div id="messages" class="panel" aria-live="polite"></div>

    <div class="panel">
      <form id="sendForm" class="row">
        <input id="message" placeholder="Écris un message…" maxlength="2000" autocomplete="off" style="margin:0;min-width:0">
        <button type="submit">➤</button>
      </form>
      <div class="row" style="margin-top:10px">
        <button id="photoBtn">📷 Photo / vidéo</button>
        <button id="voiceBtn">🎙 Vocal</button>
      </div>
      <p id="recordStatus" class="muted"></p>
      <input id="mediaFile" class="hidden" type="file" accept="image/*,video/mp4,video/webm,video/quicktime">
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const socket = io();
const $ = id => document.getElementById(id);

let myName = "", myRoom = "", joined = false;
let recorder = null, recordingStream = null, chunks = [], recordTimer = null;
let localStream = null, inCall = false, muted = false;
const peers = new Map();

function notify(text) {
  $("toast").textContent = text;
  $("toast").style.display = "block";
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => $("toast").style.display = "none", 3000);
}

socket.on("connect", () => $("status").textContent = "🟢 Connecté au serveur");
socket.on("disconnect", () => $("status").textContent = "🔴 Reconnexion…");
socket.on("connect_error", () => $("status").textContent = "Connexion impossible");

$("joinForm").addEventListener("submit", event => {
  event.preventDefault();
  myName = $("pseudo").value.trim();
  myRoom = $("room").value.trim();

  if (!myName) return notify("Entre un pseudo.");
  if (!/^[a-zA-Z0-9_-]{1,40}$/.test(myRoom)) {
    return notify("Nom de salon invalide : utilise lettres, chiffres, _ ou -.");
  }
  if (!socket.connected) return notify("Le serveur n'est pas connecté. Réessaie dans quelques secondes.");

  socket.emit("join-room", { name: myName, room: myRoom });
});

socket.on("join-error", message => notify(message));

socket.on("joined", data => {
  myName = data.name;
  myRoom = data.room;
  joined = true;
  $("login").classList.add("hidden");
  $("chat").classList.remove("hidden");
  $("roomTitle").textContent = "#" + myRoom;
  $("status").textContent = "🟢 Connecté comme " + myName;
  notify("Bienvenue dans #" + myRoom + " !");
});

socket.on("history", list => {
  $("messages").replaceChildren();
  (list || []).forEach(renderMessage);
  scrollDown();
});

socket.on("new-message", message => {
  renderMessage(message);
  scrollDown();
});

socket.on("member-count", count => {
  $("people").textContent = count + (count > 1 ? " personnes connectées" : " personne connectée");
});

socket.on("member-left", data => {
  if (data?.name) notify(data.name + " a quitté le salon.");
});

function scrollDown() {
  $("messages").scrollTop = $("messages").scrollHeight;
}

function renderMessage(m) {
  if (!m) return;
  const box = $("messages");
  const el = document.createElement("div");

  if (m.type === "system") {
    el.className = "system";
    el.textContent = m.text || "";
    box.appendChild(el);
    return;
  }

  el.className = "msg" + (m.name === myName ? " mine" : "");

  if (m.name) {
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = m.name;
    el.appendChild(name);
  }

  if (m.type === "image" || m.type === "video") {
    const media = document.createElement(m.type === "image" ? "img" : "video");
    media.src = m[m.type];
    media.alt = m.type === "image" ? "Photo partagée" : "Vidéo partagée";
    if (m.type === "video") {
      media.controls = true;
      media.playsInline = true;
    }
    el.appendChild(media);
  } else if (m.type === "audio") {
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = m.audio;
    el.appendChild(audio);
  } else {
    const text = document.createElement("div");
    text.textContent = m.text || "";
    el.appendChild(text);
  }

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = new Date(m.time || Date.now()).toLocaleTimeString("fr-FR", {
    hour: "2-digit", minute: "2-digit"
  });
  el.appendChild(time);
  box.appendChild(el);
}

$("sendForm").addEventListener("submit", event => {
  event.preventDefault();
  const text = $("message").value.trim();
  if (!joined) return notify("Rejoins d'abord un salon.");
  if (!text) return;
  socket.emit("send-message", { type: "text", text });
  $("message").value = "";
});

$("photoBtn").addEventListener("click", () => {
  if (!joined) return notify("Rejoins d'abord un salon.");
  $("mediaFile").click();
});

$("mediaFile").addEventListener("change", async event => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  if (file.size > 2.5 * 1024 * 1024) {
    return notify("Fichier trop lourd. Maximum 2,5 Mo.");
  }

  const isVideo = file.type.startsWith("video/");
  if (!isVideo && !file.type.startsWith("image/")) {
    return notify("Choisis une photo ou une vidéo.");
  }

  try {
    let data;
    if (isVideo) {
      data = await readFile(file);
    } else {
      data = await compressPhoto(file);
    }
    if (data.length > 3900000) return notify("Fichier trop lourd.");
    socket.emit("send-message", {
      type: isVideo ? "video" : "image",
      [isVideo ? "video" : "image"]: data
    });
    notify(isVideo ? "Vidéo envoyée 🎬" : "Photo envoyée 📷");
  } catch {
    notify("Impossible de lire ce fichier.");
  }
});

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function compressPhoto(file) {
  const data = await readFile(file);
  const img = new Image();
  img.src = data;
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
  });

  const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(img.width * scale));
  canvas.height = Math.max(1, Math.round(img.height * scale));
  canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.65);
}

$("voiceBtn").addEventListener("click", async () => {
  if (!joined) return notify("Rejoins d'abord un salon.");

  if (recorder?.state === "recording") {
    recorder.stop();
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    return notify("Ton navigateur ne permet pas d'enregistrer ici.");
  }

  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]
      .find(type => MediaRecorder.isTypeSupported(type));
    recorder = mime ? new MediaRecorder(recordingStream, { mimeType: mime }) : new MediaRecorder(recordingStream);
    chunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size) chunks.push(event.data);
    };

    recorder.onstop = async () => {
      clearTimeout(recordTimer);
      $("voiceBtn").textContent = "🎙 Vocal";
      $("recordStatus").textContent = "";
      recordingStream?.getTracks().forEach(track => track.stop());

      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (blob.size > 2 * 1024 * 1024) return notify("Vocal trop lourd.");
      try {
        const audio = await readFile(blob);
        socket.emit("send-message", { type: "audio", audio });
        notify("Vocal envoyé 🎙️");
      } catch {
        notify("Impossible de préparer le vocal.");
      }
    };

    recorder.start();
    $("voiceBtn").textContent = "⏹ Arrêter";
    $("recordStatus").textContent = "Enregistrement… maximum 15 secondes";
    recordTimer = setTimeout(() => {
      if (recorder?.state === "recording") recorder.stop();
    }, 15000);
  } catch {
    notify("Autorise l'accès au micro dans ton navigateur.");
  }
});

// Appel audio de groupe (connexion directe entre les appareils)
function makePeer(id) {
  if (peers.has(id)) return peers.get(id);

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });
  peers.set(id, pc);
  localStream?.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = event => {
    if (event.candidate) {
      socket.emit("voice-signal", { to: id, signal: { candidate: event.candidate } });
    }
  };

  pc.ontrack = event => {
    let audio = document.getElementById("audio-" + id);
    if (!audio) {
      audio = document.createElement("audio");
      audio.id = "audio-" + id;
      audio.autoplay = true;
      audio.controls = true;
      $("remoteAudio").appendChild(audio);
    }
    audio.srcObject = event.streams[0];
    audio.play().catch(() => {});
  };

  return pc;
}

async function offerTo(id) {
  const pc = makePeer(id);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit("voice-signal", { to: id, signal: { description: pc.localDescription } });
}

$("callBtn").addEventListener("click", async () => {
  if (!joined) return notify("Rejoins d'abord un salon.");
  if (inCall) {
    $("callPanel").classList.remove("hidden");
    return;
  }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    inCall = true;
    muted = false;
    $("callPanel").classList.remove("hidden");
    $("callStatus").textContent = "Connexion à l'appel…";
    $("muteBtn").textContent = "Couper micro";
    socket.emit("voice-join");
  } catch {
    notify("Autorise l'accès au micro pour appeler.");
  }
});

socket.on("voice-peers", async ids => {
  for (const id of ids || []) {
    try { await offerTo(id); } catch (error) { console.error(error); }
  }
  $("callStatus").textContent = ids?.length ? "Connexion aux autres membres…" : "En attente de tes potes…";
});

socket.on("voice-peer-joined", () => {
  $("callStatus").textContent = "Un membre rejoint l'appel…";
});

socket.on("voice-signal", async data => {
  if (!inCall || !data?.from || !data?.signal) return;
  const pc = makePeer(data.from);
  const signal = data.signal;

  try {
    if (signal.description) {
      await pc.setRemoteDescription(signal.description);
      if (signal.description.type === "offer") {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit("voice-signal", {
          to: data.from,
          signal: { description: pc.localDescription }
        });
      }
    } else if (signal.candidate) {
      await pc.addIceCandidate(signal.candidate);
    }
    $("callStatus").textContent = "Appel audio connecté 🎧";
  } catch (error) {
    console.error("Signal audio :", error);
  }
});

socket.on("voice-peer-left", id => {
  peers.get(id)?.close();
  peers.delete(id);
  document.getElementById("audio-" + id)?.remove();
});

$("muteBtn").addEventListener("click", () => {
  if (!localStream) return;
  muted = !muted;
  localStream.getAudioTracks().forEach(track => track.enabled = !muted);
  $("muteBtn").textContent = muted ? "Activer micro" : "Couper micro";
});

async function hangup() {
  if (inCall) socket.emit("voice-leave");
  inCall = false;
  peers.forEach(pc => pc.close());
  peers.clear();
  localStream?.getTracks().forEach(track => track.stop());
  localStream = null;
  $("remoteAudio").replaceChildren();
  $("callPanel").classList.add("hidden");
  $("callStatus").textContent = "Appel terminé";
}

$("hangBtn").addEventListener("click", hangup);

$("leaveBtn").addEventListener("click", async () => {
  await hangup();
  joined = false;
  $("chat").classList.add("hidden");
  $("login").classList.remove("hidden");
  notify("Tu as quitté le salon.");
});
</script>
</body>
        </html>
