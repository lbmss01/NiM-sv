

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10091d">
<title>NiM — Next is Me</title>
<style>
:root{--bg:#0c0714;--panel:#191025;--pink:#ff4fbd;--purple:#9657ff;--text:#fff;--muted:#bcaecb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#30134a,#10091b 55%,#09060e);color:var(--text);font-family:system-ui,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5}
.hidden{display:none!important}
.app{max-width:850px;margin:auto;min-height:100dvh;padding:16px;display:flex;flex-direction:column}
.brand{font-size:38px;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#fff,var(--pink),var(--purple));background-clip:text;color:transparent}
.subtitle{color:var(--muted);margin-top:-5px}
.panel{background:#191025eF;border:1px solid #ffffff17;border-radius:22px;box-shadow:0 12px 45px #0003}
#home{margin:auto 0;padding:24px}
.field{display:block;margin:16px 0;color:var(--muted);font-size:14px}
.field input{display:block;width:100%;padding:14px;margin-top:7px;background:#0d0814;color:white;border:1px solid #ffffff20;border-radius:13px;outline:none}
.field input:focus{border-color:var(--purple)}
.primary{padding:13px 17px;border:0;border-radius:14px;background:linear-gradient(100deg,var(--purple),var(--pink));color:white;font-weight:750}
.full{width:100%;margin-top:8px}
.note{color:var(--muted);font-size:12px;margin-top:15px}
#chat{flex:1;min-height:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:12px;margin:12px 0}
.room-title{flex:1;min-width:0}
.room-title strong{display:block;overflow-wrap:anywhere}
.room-title small{color:var(--muted)}
.round{height:43px;min-width:43px;padding:0 10px;border-radius:13px;border:1px solid #ffffff20;background:#281938;color:white}
#callButton{background:linear-gradient(130deg,#8049ed,#d83bab);border:0}
#messages{flex:1;min-height:230px;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:10px}
.message{max-width:90%;align-self:flex-start;overflow-wrap:anywhere;background:#271832;border-radius:16px 16px 16px 5px;padding:11px 13px}
.message.mine{align-self:flex-end;background:linear-gradient(135deg,#5733a0,#7b286f);border-radius:16px 16px 5px 16px}
.meta{font-size:11px;color:#ddcde9;margin-bottom:5px}
.body{white-space:pre-wrap}
.message img{display:block;max-width:100%;max-height:360px;border-radius:11px}
.message audio{display:block;width:250px;max-width:100%;height:42px}
.system{align-self:center;text-align:center;color:var(--muted);font-size:12px;padding:4px}
.composer{display:flex;align-items:center;gap:7px;padding:9px;margin-top:10px;margin-bottom:env(safe-area-inset-bottom)}
#messageInput{flex:1;min-width:0;padding:13px;border-radius:14px;border:1px solid #ffffff20;background:#0d0814;color:white;outline:none}
#sendButton{height:45px;width:46px;padding:0}
#recordStatus{font-size:12px;color:var(--pink);text-align:center;padding:5px}
#callPanel{padding:16px;text-align:center;margin-bottom:10px}
#callStatus{font-size:13px;color:#f1d7ff;margin:12px 0}
#callPanel p{font-size:13px;color:var(--muted)}
.call-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b1a3d;border:1px solid #ffffff30;padding:12px 16px;border-radius:14px;max-width:90%;z-index:9;text-align:center}
@media(max-width:500px){.app{padding:10px}#home{padding:19px}.brand{font-size:34px}#messages{padding:10px 3px}.message{max-width:94%}.composer{gap:5px;padding:7px 3px}.round{min-width:38px;padding:0 8px}.message audio{width:225px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">NiM.</div>
  <div class="subtitle">Next is Me · connecte-toi à tes potes.</div>
</header>

<section id="home" class="panel">
  <h2>Entre dans NiM ✨</h2>
  <p style="color:var(--muted)">Rejoins un salon pour discuter.</p>
  <form id="joinForm">
    <label class="field">Ton pseudo
      <input id="nameInput" maxlength="24" placeholder="Ex. Lolo" autocomplete="nickname" required>
    </label>
    <label class="field">Nom du salon
      <input id="roomInput" maxlength="40" value="general" placeholder="Ex. potes" required>
    </label>
    <button id="joinButton" class="primary full" type="submit">Entrer dans le salon →</button>
  </form>
  <p class="note">Tes amis doivent utiliser exactement le même nom de salon.</p>
</section>

<section id="chat" class="hidden">
  <div class="topbar panel">
    <button id="backButton" class="round" type="button">←</button>
    <div class="room-title"><strong id="roomLabel">Salon</strong><small id="nameLabel"></small></div>
    <button id="callButton" class="round" type="button" title="Appel audio">📞</button>
  </div>

  <section id="callPanel" class="panel hidden">
    <strong>📞 Appel audio</strong>
    <div id="callStatus">Prêt à rejoindre</div>
    <p>Autorise le micro pour parler aux membres du salon.</p>
    <div class="call-actions">
      <button id="joinCallButton" class="primary" type="button">Rejoindre</button>
      <button id="muteButton" class="round hidden" type="button">🔇 Couper le micro</button>
      <button id="hangupButton" class="round hidden" type="button">Raccrocher</button>
    </div>
    <div id="remoteAudios"></div>
  </section>

  <div id="messages" class="panel" aria-live="polite"></div>
  <div id="recordStatus"></div>
  <form id="messageForm" class="composer panel">
    <button id="photoButton" class="round" type="button" title="Envoyer une photo">🖼️</button>
    <input id="photoInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp">
    <button id="recordButton" class="round" type="button" title="Vocal">🎙️</button>
    <input id="messageInput" maxlength="2000" placeholder="Écris un message…" autocomplete="off">
    <button id="sendButton" class="primary" type="submit">➤</button>
  </form>
</section>
</div>
<div id="toast" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const socket = io({ autoConnect: true });

  let myName = "";
  let myRoom = "";
  let joined = false;
  let joinPending = false;
  let recorder = null;
  let recordStream = null;
  let recordChunks = [];
  let recordTimer = null;
  let localStream = null;
  let inCall = false;
  let muted = false;
  const peers = new Map();
  const candidateQueues = new Map();

  function toast(text) {
    const el = $("toast");
    el.textContent = text;
    el.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.add("hidden"), 3500);
  }

  function enterSalon() {
    $("home").classList.add("hidden");
    $("chat").classList.remove("hidden");
    $("roomLabel").textContent = "#" + myRoom;
    $("nameLabel").textContent = "Connecté en tant que " + myName;
    joined = true;
    joinPending = false;
    $("joinButton").disabled = false;
    $("joinButton").textContent = "Entrer dans le salon →";
  }

  function returnHome() {
    $("chat").classList.add("hidden");
    $("home").classList.remove("hidden");
    joined = false;
    joinPending = false;
    $("joinButton").disabled = false;
    $("joinButton").textContent = "Entrer dans le salon →";
  }

  function requestJoin() {
    if (!myName || !myRoom || !socket.connected) return;
    socket.emit("join-room", { name: myName, room: myRoom });
  }

  $("joinForm").addEventListener("submit", event => {
    event.preventDefault();

    if (joinPending) return;

    const name = $("nameInput").value.trim().slice(0, 24);
    const room = $("roomInput").value.trim().slice(0, 40);

    if (!name) {
      toast("Entre un pseudo.");
      return;
    }
    if (!/^[a-zA-Z0-9_-]{1,40}$/.test(room)) {
      toast("Le salon doit contenir uniquement des lettres, chiffres, _ ou -.");
      return;
    }

    myName = name;
    myRoom = room;
    joined = false;
    joinPending = true;
    $("joinButton").disabled = true;
    $("joinButton").textContent = "Connexion…";

    if (socket.connected) {
      requestJoin();
    } else {
      socket.connect();
    }

    clearTimeout(joinPending.timer);
    joinPending.timer = setTimeout(() => {
      if (!joined) {
        joinPending = false;
        $("joinButton").disabled = false;
        $("joinButton").textContent = "Réessayer";
        toast("Le serveur ne répond pas. Vérifie Render et réessaie.");
      }
    }, 10000);
  });

  socket.on("connect", () => {
    if (myName && myRoom && !joined) requestJoin();
  });

  socket.on("joined", data => {
    clearTimeout(joinPending.timer);
    if (data && data.name) myName = data.name;
    if (data && data.room) myRoom = data.room;
    enterSalon();
  });

  socket.on("join-error", message => {
    clearTimeout(joinPending.timer);
    joinPending = false;
    $("joinButton").disabled = false;
    $("joinButton").textContent = "Réessayer";
    toast(message || "Impossible de rejoindre ce salon.");
  });

  socket.on("connect_error", () => {
    if (joinPending) {
      $("joinButton").disabled = false;
      $("joinButton").textContent = "Réessayer";
      joinPending = false;
    }
    toast("Connexion au serveur impossible. Réessaie.");
  });

  socket.on("history", list => {
    $("messages").replaceChildren();
    (list || []).forEach(renderMessage);
    scrollBottom();
  });

  socket.on("new-message", message => {
    renderMessage(message);
    scrollBottom();
  });

  function scrollBottom() {
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function renderMessage(msg) {
    if (!msg) return;
    const el = document.createElement("div");

    if (msg.type === "system") {
      el.className = "system";
      el.textContent = msg.text || "";
      $("messages").appendChild(el);
      return;
    }

    el.className = "message" + (msg.name === myName ? " mine" : "");

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (msg.name || "Membre") + " · " +
      new Date(msg.time || Date.now()).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    el.appendChild(meta);

    if (msg.type === "text") {
      const text = document.createElement("div");
      text.className = "body";
      text.textContent = msg.text || "";
      el.appendChild(text);
    } else if (msg.type === "image" && msg.image) {
      const image = document.createElement("img");
      image.src = msg.image;
      image.alt = "Photo envoyée";
      image.loading = "lazy";
      el.appendChild(image);
    } else if (msg.type === "audio" && msg.audio) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "metadata";
      audio.src = msg.audio;
      audio.setAttribute("playsinline", "");
      audio.addEventListener("error", () => toast("Ce vocal n'est pas lisible sur cet appareil."));
      el.appendChild(audio);
    }

    $("messages").appendChild(el);
  }

  $("messageForm").addEventListener("submit", event => {
    event.preventDefault();
    if (!joined || !socket.connected) {
      toast("Tu n'es pas connecté au salon.");
      return;
    }
    const text = $("messageInput").value.trim();
    if (!text) return;
    socket.emit("send-message", {type:"text", text});
    $("messageInput").value = "";
  });

  $("photoButton").addEventListener("click", () => $("photoInput").click());

  $("photoInput").addEventListener("change", async () => {
    const file = $("photoInput").files && $("photoInput").files[0];
    $("photoInput").value = "";
    if (!file || !joined) return;

    try {
      const data = await compressPhoto(file);
      if (data.length > 740000) {
        toast("Photo trop lourde. Choisis une photo plus petite.");
        return;
      }
      socket.emit("send-message", {type:"image", image:data});
    } catch (e) {
      toast("Impossible de charger cette photo.");
    }
  });

  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, 1100 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function blobDataURL(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  }

  $("recordButton").addEventListener("click", async () => {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      return;
    }
    if (!joined) return;

    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      toast("Ton navigateur ne permet pas l'enregistrement audio.");
      return;
    }

    try {
      recordStream = await navigator.mediaDevices.getUserMedia({audio:true});
      const formats = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/ogg"];
      const format = formats.find(f => MediaRecorder.isTypeSupported?.(f));
      recorder = format ? new MediaRecorder(recordStream,{mimeType:format}) : new MediaRecorder(recordStream);
      recordChunks = [];

      recorder.ondataavailable = event => {
        if (event.data?.size) recordChunks.push(event.data);
      };

      recorder.onstop = async () => {
        clearTimeout(recordTimer);
        $("recordStatus").textContent = "";
        $("recordButton").textContent = "🎙️";
        recordStream?.getTracks().forEach(t => t.stop());
        recordStream = null;

        if (!recordChunks.length) {
          toast("Vocal vide. Réessaie.");
          return;
        }

        try {
          const type = recorder.mimeType || recordChunks[0].type || "audio/webm";
          const blob = new Blob(recordChunks,{type});
          const data = await blobDataURL(blob);
          if (data.length > 740000) {
            toast("Vocal trop lourd. Enregistre un message plus court.");
            return;
          }
          socket.emit("send-message",{type:"audio",audio:data});
        } catch (e) {
          toast("Impossible d'envoyer ce vocal.");
        }
      };

      recorder.start();
      $("recordButton").textContent = "⏹️";
      $("recordStatus").textContent = "🔴 Enregistrement en cours · 20 secondes maximum";
      recordTimer = setTimeout(() => {
        if (recorder?.state === "recording") recorder.stop();
      },20000);
    } catch (e) {
      toast("Autorise le micro dans les paramètres du navigateur.");
    }
  });

  $("callButton").addEventListener("click", () => $("callPanel").classList.toggle("hidden"));
  $("joinCallButton").addEventListener("click", startCall);
  $("hangupButton").addEventListener("click", stopCall);

  $("muteButton").addEventListener("click", () => {
    if (!localStream) return;
    muted = !muted;
    localStream.getAudioTracks().forEach(track => track.enabled = !muted);
    $("muteButton").textContent = muted ? "🎙️ Activer le micro" : "🔇 Couper le micro";
  });

  async function startCall() {
    if (inCall || !joined) return;
    if (!navigator.mediaDevices?.getUserMedia) {
      toast("Les appels nécessitent une connexion HTTPS et un micro autorisé.");
      return;
    }

    $("joinCallButton").disabled = true;
    $("callStatus").textContent = "Demande d'accès au micro…";

    try {
      localStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      inCall = true;
      muted = false;
      $("joinCallButton").classList.add("hidden");
      $("muteButton").classList.remove("hidden");
      $("hangupButton").classList.remove("hidden");
      $("callStatus").textContent = "Connexion à l'appel…";
      socket.emit("voice-join");
    } catch (e) {
      $("callStatus").textContent = "Micro indisponible.";
      toast("Autorise le micro pour lancer l'appel.");
    } finally {
      $("joinCallButton").disabled = false;
    }
  }

  function getPeer(id) {
    if (peers.has(id)) return peers.get(id);

    const pc = new RTCPeerConnection({
      iceServers:[{urls:"stun:stun.l.google.com:19302"}]
    });

    localStream?.getTracks().forEach(track => pc.addTrack(track,localStream));

    pc.onicecandidate = event => {
      if (event.candidate) {
        socket.emit("voice-signal",{to:id,signal:{candidate:event.candidate}});
      }
    };

    pc.ontrack = event => {
      let audio = $("remote-"+id);
      if (!audio) {
        audio = document.createElement("audio");
        audio.id = "remote-"+id;
        audio.autoplay = true;
        audio.controls = true;
        audio.setAttribute("playsinline","");
        audio.style.display = "block";
        audio.style.width = "100%";
        audio.style.marginTop = "8px";
        $("remoteAudios").appendChild(audio);
      }
      if (event.streams?.[0]) {
        audio.srcObject = event.streams[0];
        audio.play().catch(() => $("callStatus").textContent = "Appuie sur lecture pour activer le son.");
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") $("callStatus").textContent = "🟢 Appel audio connecté";
      if (pc.connectionState === "failed") $("callStatus").textContent = "Échec de connexion audio. Essaie un autre réseau.";
    };

    peers.set(id,pc);
    candidateQueues.set(id,[]);
    return pc;
  }

  async function offerTo(id) {
    try {
      const pc = getPeer(id);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("voice-signal",{to:id,signal:{description:pc.localDescription}});
    } catch (e) {
      console.error(e);
    }
  }

  socket.on("voice-peers", async ids => {
    if (!inCall) return;
    for (const id of (ids || [])) await offerTo(id);
    if (!ids?.length) $("callStatus").textContent = "Dans l'appel · en attente des autres membres";
  });

  socket.on("voice-peer-joined", () => {
    if (inCall) $("callStatus").textContent = "Un membre rejoint l'appel…";
  });

  socket.on("voice-signal", async ({from,signal}) => {
    if (!inCall || !from || !signal) return;

    try {
      const pc = getPeer(from);

      if (signal.description) {
        await pc.setRemoteDescription(signal.description);
        const queue = candidateQueues.get(from) || [];
        for (const candidate of queue) {
          try { await pc.addIceCandidate(candidate); } catch (e) {}
        }
        candidateQueues.set(from,[]);

        if (signal.description.type === "offer") {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit("voice-signal",{to:from,signal:{description:pc.localDescription}});
        }
      } else if (signal.candidate) {
        if (pc.remoteDescription) {
          await pc.addIceCandidate(signal.candidate);
        } else {
          const queue = candidateQueues.get(from) || [];
          queue.push(signal.candidate);
          candidateQueues.set(from,queue);
        }
      }
    } catch (e) {
      console.error("Signal audio :",e);
    }
  });

  socket.on("voice-peer-left", id => closePeer(id));

  function closePeer(id) {
    peers.get(id)?.close();
    peers.delete(id);
    candidateQueues.delete(id);
    const audio = $("remote-"+id);
    if (audio) {
      audio.pause();
      audio.srcO
