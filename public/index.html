
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b1c">
<title>NiM Chat</title>

<style>
:root {
  --bg:#0b0811;
  --panel:#171020;
  --purple:#a855f7;
  --pink:#ec4899;
  --text:#faf7ff;
  --muted:#a99bb8;
  --border:#ffffff14;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
  background:radial-gradient(ellipse at 10% 0%,#35134d,transparent 42%),
  radial-gradient(ellipse at 100% 100%,#30102f,transparent 40%),var(--bg)
}
button,input{font:inherit}
button{cursor:pointer}
.screen{max-width:720px;min-height:100dvh;margin:auto;display:flex;flex-direction:column}
header{
  display:flex;align-items:center;gap:12px;padding:17px 15px;
  background:#100b1cdd;border-bottom:1px solid var(--border)
}
.logo{
  width:45px;height:45px;border-radius:15px;display:grid;place-items:center;
  font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--pink))
}
.brand{font-size:22px;font-weight:900}
.brand span{color:#d8a4ff}
.subtitle{font-size:12px;color:var(--muted)}
.status{margin-left:auto;font-size:11px;color:#86efac}
#joinScreen{
  width:calc(100% - 32px);max-width:390px;margin:auto;padding:25px 21px;
  border:1px solid var(--border);border-radius:25px;background:#171020eF
}
.hero{text-align:center;font-size:43px}
h1{text-align:center;margin:4px 0 8px}
.intro{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
label{display:block;font-size:13px;margin:15px 0 7px}
.field{
  width:100%;padding:14px;border-radius:13px;background:#0e0a15;
  color:white;border:1px solid var(--border);outline:none
}
.field:focus{border-color:var(--purple)}
.primary{
  color:white;border:0;border-radius:13px;padding:13px 16px;font-weight:750;
  background:linear-gradient(100deg,#9333ea,#db2777)
}
.primary:disabled{opacity:.55;cursor:wait}
#joinButton{width:100%;margin-top:22px}
.note{text-align:center;color:#8c7e99;font-size:11px;margin-top:16px}
#chatScreen{display:none;flex:1;min-height:0;flex-direction:column}
.room-info{padding:10px 15px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}
#messages{flex:1;min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding:17px 12px 25px}
.system{align-self:center;text-align:center;font-size:11px;color:var(--muted);background:#ffffff08;padding:6px 11px;border-radius:20px}
.message{max-width:85%;align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:70px}
.message.mine{align-self:flex-end;align-items:flex-end}
.sender{font-size:11px;color:#d8b4fe;padding:0 7px}
.bubble{
  padding:11px 13px;background:#21182e;border:1px solid var(--border);
  border-radius:17px 17px 17px 5px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.4
}
.mine .bubble{background:linear-gradient(135deg,#8738d4,#bb287d);border-radius:17px 17px 5px 17px}
.time{font-size:10px;color:#a99bb8;padding:0 7px}
.chat-image{display:block;width:100%;max-width:260px;max-height:320px;object-fit:contain;border-radius:12px}
.audio-bubble{width:min(270px,70vw)}
.audio-title{font-size:12px;margin-bottom:7px}
audio{width:100%;height:38px;display:block}
.composer-wrap{padding:11px 10px calc(11px + env(safe-area-inset-bottom));background:#100b1cf5;border-top:1px solid var(--border)}
#voiceStatus{display:none;color:#f9a8d4;font-size:12px;padding:0 5px 10px}
#voiceStatus.active{display:block}
.composer{display:flex;align-items:center;gap:7px}
.icon-button{
  width:43px;height:43px;flex-shrink:0;border:1px solid var(--border);
  border-radius:13px;background:#21172e;color:white;font-size:19px
}
.icon-button:disabled{opacity:.5}
#messageInput{flex:1;min-width:0;background:#1a1325;color:white;border:1px solid var(--border);border-radius:14px;padding:12px;outline:none}
#sendButton{width:44px;height:43px;padding:0;font-size:19px}
#toast{
  display:none;position:fixed;z-index:10;bottom:100px;left:50%;transform:translateX(-50%);
  max-width:90%;padding:12px 15px;border-radius:13px;background:#352341;
  border:1px solid #ffffff22;color:white;font-size:13px
}
@media(min-width:600px){
 body{padding:16px}
 .screen{min-height:calc(100dvh - 32px);border:1px solid var(--border);border-radius:24px;overflow:hidden;background:#0c0913aa}
}
</style>
</head>

<body>
<div class="screen">
  <header>
    <div class="logo">N</div>
    <div>
      <div class="brand">NiM <span>Chat</span></div>
      <div class="subtitle">Next is Me · Ton univers</div>
    </div>
    <div class="status" id="connectionStatus">● Prêt</div>
  </header>

  <section id="joinScreen">
    <div class="hero">💬</div>
    <h1>Rejoins NiM</h1>
    <p class="intro">Retrouve tes amis dans un salon.</p>
    <form id="joinForm">
      <label for="nameInput">Ton pseudo</label>
      <input class="field" id="nameInput" maxlength="24" placeholder="Ex. Lolo" autocomplete="nickname" required>
      <label for="roomInput">Nom du salon</label>
      <input class="field" id="roomInput" maxlength="32" placeholder="Ex. amis123" required>
      <button class="primary" id="joinButton" type="submit">Entrer dans le chat →</button>
    </form>
    <div class="note">Pas de compte nécessaire pour le moment.</div>
  </section>

  <section id="chatScreen">
    <div class="room-info">Salon : <strong id="roomName"></strong></div>
    <main id="messages" aria-live="polite"></main>
    <div class="composer-wrap">
      <div id="voiceStatus">🔴 Enregistrement : <span id="voiceTimer">0:00 / 0:20</span> — appuie sur ■ pour envoyer</div>
      <form class="composer" id="messageForm">
        <button class="icon-button" id="imageButton" type="button" title="Envoyer une photo">＋</button>
        <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <input id="messageInput" maxlength="500" placeholder="Écris un message..." autocomplete="off">
        <button class="icon-button" id="micButton" type="button" title="Message vocal">🎙️</button>
        <button class="primary" id="sendButton" type="submit">➤</button>
      </form>
    </div>
  </section>
</div>
<div id="toast" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);

  const socket = io({ autoConnect: false });

  let myName = "";
  let myRoom = "";
  let joined = false;
  let joinRequested = false;
  let joinTimeout = null;
  let recorder = null;
  let stream = null;
  let chunks = [];
  let recordStart = 0;
  let recordInterval = null;
  let recordTimeout = null;
  let stopping = false;
  let toastTimeout = null;

  function toast(text) {
    $("toast").textContent = text;
    $("toast").style.display = "block";
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => $("toast").style.display = "none", 3500);
  }

  function setStatus(text) {
    $("connectionStatus").textContent = text;
  }

  function updateJoinButton(text, disabled) {
    $("joinButton").textContent = text;
    $("joinButton").disabled = disabled;
  }

  function sendJoinRequest() {
    if (!socket.connected || !joinRequested || !myName || !myRoom) return;
    setStatus("● Connexion...");
    socket.emit("join-room", { name: myName, room: myRoom });
  }

  $("joinForm").addEventListener("submit", event => {
    event.preventDefault();

    myName = $("nameInput").value.trim().slice(0, 24);
    myRoom = $("roomInput").value.trim().slice(0, 32);

    if (!myName || !myRoom) {
      toast("Entre un pseudo et un nom de salon.");
      return;
    }

    joined = false;
    joinRequested = true;
    updateJoinButton("Connexion...", true);

    clearTimeout(joinTimeout);
    joinTimeout = setTimeout(() => {
      if (!joined) {
        updateJoinButton("Réessayer →", false);
        setStatus("● À vérifier");
        toast("La connexion prend trop de temps. Réessaie.");
      }
    }, 10000);

    if (socket.connected) {
      sendJoinRequest();
    } else {
      socket.connect();
    }
  });

  socket.on("connect", () => {
    setStatus("● Connecté");
    if (joinRequested) sendJoinRequest();
  });

  socket.on("connect_error", () => {
    setStatus("● Hors ligne");
    updateJoinButton("Réessayer →", false);
    toast("Connexion au serveur impossible. Réessaie.");
  });

  socket.on("disconnect", () => {
    setStatus("● Reconnexion...");
    if (joined) toast("Connexion perdue, tentative de reconnexion...");
  });

  socket.on("joined", data => {
    clearTimeout(joinTimeout);
    joined = true;
    joinRequested = true;
    myName = data.name || myName;
    myRoom = data.room || myRoom;

    $("roomName").textContent = myRoom;
    $("joinScreen").style.display = "none";
    $("chatScreen").style.display = "flex";
    updateJoinButton("Entrer dans le chat →", false);
    setStatus("● Connecté");
    $("messageInput").focus();
    scrollBottom();
  });

  socket.on("history", history => {
    $("messages").replaceChildren();
    if (Array.isArray(history)) history.forEach(renderMessage);
  });

  socket.on("chat-message", renderMessage);

  socket.on("error-message", message => {
    toast(message || "Une erreur est survenue.");
    if (!joined) updateJoinButton("Réessayer →", false);
  });

  function scrollBottom() {
    requestAnimationFrame(() => {
      $("messages").scrollTop = $("messages").scrollHeight;
    });
  }

  function renderMessage(msg) {
    if (!msg || typeof msg !== "object") return;

    if (msg.type === "system") {
      const el = document.createElement("div");
      el.className = "system";
      el.textContent = msg.text || "";
      $("messages").appendChild(el);
      scrollBottom();
      return;
    }

    const wrapper = document.createElement("article");
    wrapper.className = "message" + (msg.name === myName ? " mine" : "");

    if (msg.name !== myName) {
      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = msg.name || "Membre";
      wrapper.appendChild(sender);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (msg.type === "text") {
      bubble.textContent = msg.text || "";
    } else if (msg.type === "image") {
      const img = document.createElement("img");
      img.className = "chat-image";
      img.alt = "Photo envoyée";
      img.loading = "lazy";
      img.src = msg.image;
      bubble.appendChild(img);
    } else if (msg.type === "audio") {
      bubble.classList.add("audio-bubble");

      const title = document.createElement("div");
      title.className = "audio-title";
      title.textContent = "🎙️ Message vocal";

      const player = document.createElement("audio");
      player.controls = true;
      player.preload = "metadata";
      player.src = msg.audio;

      bubble.append(title, player);
    } else {
      return;
    }

    wrapper.appendChild(bubble);

    const time = document.createElement("div");
    time.className = "time";
    const date = new Date(msg.time);
    time.textContent = Number.isNaN(date.getTime()) ? "" :
      date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    wrapper.appendChild(time);
    $("messages").appendChild(wrapper);
    scrollBottom();
  }

  $("messageForm").addEventListener("submit", event => {
    event.preventDefault();
    const text = $("messageInput").value.trim();

    if (!joined || !socket.connected) {
      toast("Attends la connexion au salon.");
      return;
    }
    if (!text) return;

    socket.emit("send-message", { type: "text", text });
    $("messageInput").value = "";
    $("messageInput").focus();
  });

  $("imageButton").addEventListener("click", () => {
    if (joined) $("imageInput").click();
    else toast("Entre d'abord dans un salon.");
  });

  $("imageInput").addEventListener("change", async () => {
    const file = $("imageInput").files[0];
    $("imageInput").value = "";
    if (!file || !joined) return;

    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
      toast("Choisis une photo JPG, PNG ou WebP.");
      return;
    }
    if (file.size > 12 * 1024 * 1024) {
      toast("Photo trop lourde. Choisis-en une plus petite.");
      return;
    }

    $("imageButton").disabled = true;

    try {
      const url = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const img = new Image();
      img.src = url;
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });

      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

      const compressed = canvas.toDataURL("image/jpeg", 0.68);
      if (compressed.length > 750000) {
        toast("Photo trop lourde. Essaie une autre image.");
        return;
      }

      socket.emit("send-message", { type: "image", image: compressed });
    } catch {
      toast("Impossible de préparer cette photo.");
    } finally {
      $("imageButton").disabled = false;
    }
  });

  function stopMicrophone() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
  }

  function resetRecorderUI() {
    clearInterval(recordInterval);
    clearTimeout(recordTimeout);
    recordInterval = null;
    recordTimeout = null;
    $("voiceStatus").classList.remove("active");
    $("micButton").textContent = "🎙️";
    $("micButton").disabled = false;
    stopping = false;
  }

  async function startRecording() {
    if (!joined || recorder) return;

    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      toast("Ton navigateur ne permet pas l'enregistrement vocal.");
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
      let options = {};
      const supported = types.find(type => MediaRecorder.isTypeSupported(type));
      if (supported) options.mimeType = supported;

      recorder = new MediaRecorder(stream, options);
      chunks = [];
      stopping = false;

      recorder.addEventListener("dataavailable", event => {
        if (event.data && event.data.size) chunks.push(event.data);
      });

      recorder.addEventListener("stop", async () => {
        const mime = recorder?.mimeType || chunks[0]?.type || "audio/webm";
        const blob = new Blob(chunks, { type: mime });

        recorder = null;
        chunks = [];
        stopMicrophone();
        resetRecorderUI();

        if (!blob.size) {
          toast("Aucun son enregistré. Réessaie.");
          return;
        }
        if (blob.size > 540000) {
          toast("Vocal trop lourd. Essaie un enregistrement plus court.");
          return;
        }

        try {
          const data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });

          if (typeof data !== "string" || data.length > 750000) {
            toast("Vocal trop lourd. Réessaie plus court.");
            return;
          }
          if (joined && socket.connected) {
            socket.emit("send-message", { type: "audio", audio: data });
          } else {
            toast("Tu n'es plus connecté au salon.");
          }
        } catch {
          toast("Impossible de préparer le vocal.");
        }
      });

      recorder.addEventListener("error", () => {
        recorder = null;
        stopMicrophone();
        resetRecorderUI();
        toast("Erreur pendant l'enregistrement.");
      });

      recorder.start();
      recordStart = Date.now();
      $("voiceStatus").classList.add("active");
      $("micButton").textContent = "■";
      $("micButton").disabled = false;

      const updateTimer = () => {
        const seconds = Math.min(20, Math.floor((Date.now() - recordStart) / 1000));
        $("voiceTimer").textContent = `0:${String(seconds).padStart(2, "0")} / 0:20`;
      };

      updateTimer();
      recordInterval = setInterval(updateTimer, 250);
      recordTimeout = setTimeout(stopRecording, 20000);
    } catch {
      stopMicrophone();
      recorder = null;
      resetRecorderUI();
      toast("Autorise l'accès au microphone puis réessaie.");
    }
  }

  function stopRecording() {
    if (!recorder || recorder.state === "inactive" || stopping) return;
    stopping = true;
    $("micButton").disabled = true;
    clearTimeout(recordTimeout);
    try {
      recorder.stop();
    } catch {
      recorder = null;
      stopMicrophone();
      resetRecorderUI();
      toast("Impossible d'arrêter l'enregistrement.");
    }
  }

  $("micButton").addEventListener("click", () => {
    if (recorder) stopRecording();
    else startRecording();
  });

  window.addEventListener("beforeunload", stopMicrophone);
})();
</script>
</body>
  </html>
