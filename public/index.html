
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10091d">
<title>NiM — Next is Me</title>
<style>
:root {
  --bg:#0b0712; --panel:#171022; --panel2:#21152f;
  --pink:#ff4fbd; --purple:#9b5cff; --text:#f8f2ff;
  --muted:#b5a8c7; --line:#ffffff16;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--text);
  background:radial-gradient(ellipse at top,#28123f 0%,#10091b 45%,#09060e 100%);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
button,input { font:inherit; }
button { cursor:pointer; }
button:disabled { opacity:.45; cursor:not-allowed; }
.hidden { display:none!important; }
.app { width:100%; max-width:850px; min-height:100dvh; margin:auto; padding:18px; display:flex; flex-direction:column; }
.brand { font-size:38px; font-weight:900; letter-spacing:-2px; background:linear-gradient(90deg,#fff,var(--pink),var(--purple)); color:transparent; background-clip:text; }
.subtitle { color:var(--muted); margin-top:-5px; }
.panel { background:#160f22d9; border:1px solid var(--line); border-radius:24px; box-shadow:0 15px 60px #0004; backdrop-filter:blur(15px); }
#home { margin:auto 0; padding:25px; }
h1,h2,p { margin-top:0; }
.field { display:block; margin:15px 0; color:var(--muted); font-size:14px; }
.field input { display:block; width:100%; margin-top:7px; padding:14px; color:white; background:#0c0813; border:1px solid #ffffff20; border-radius:14px; outline:none; }
.field input:focus { border-color:var(--purple); }
.primary { border:0; border-radius:14px; padding:13px 17px; color:white; font-weight:750; background:linear-gradient(100deg,var(--purple),var(--pink)); }
.full { width:100%; margin-top:8px; }
.note { color:var(--muted); font-size:12px; margin:15px 0 0; }
#chat { flex:1; min-height:0; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; gap:12px; padding:13px; margin-bottom:12px; }
.room-title { flex:1; min-width:0; }
.room-title strong { display:block; overflow-wrap:anywhere; }
.room-title small { color:var(--muted); }
.round { border:1px solid #ffffff1c; color:white; background:var(--panel2); border-radius:13px; min-width:43px; height:43px; padding:0 11px; }
#callButton { background:linear-gradient(135deg,#7d45e8,#d83baf); border:0; }
#messages { flex:1; min-height:220px; overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; gap:11px; }
.message { max-width:88%; align-self:flex-start; overflow-wrap:anywhere; background:#21172f; border:1px solid #ffffff0c; padding:11px 13px; border-radius:17px 17px 17px 5px; }
.message.mine { align-self:flex-end; background:linear-gradient(135deg,#5632a0,#7d286e); border-radius:17px 17px 5px 17px; }
.message .meta { color:#d5c5e8; font-size:11px; margin-bottom:5px; }
.message .body { white-space:pre-wrap; }
.message img { display:block; max-width:100%; width:auto; max-height:360px; object-fit:contain; border-radius:12px; }
.message audio { display:block; max-width:100%; width:260px; height:42px; }
.system { align-self:center; max-width:100%; text-align:center; color:var(--muted); font-size:12px; padding:4px 10px; }
.composer { padding:11px; display:flex; gap:8px; align-items:center; margin-top:12px; margin-bottom:env(safe-area-inset-bottom); }
#messageInput { flex:1; min-width:0; padding:13px; color:white; background:#0c0813; border:1px solid #ffffff1a; border-radius:15px; outline:none; }
#sendButton { width:46px; height:46px; flex-shrink:0; }
.composer .round { flex-shrink:0; }
#recordStatus { font-size:12px; color:var(--pink); text-align:center; padding:4px; }
#callPanel { padding:18px; margin-bottom:12px; text-align:center; }
#callPanel p { color:var(--muted); margin-bottom:12px; }
.call-actions { display:flex; justify-content:center; gap:10px; }
#callStatus { color:#f7d9ff; font-size:14px; margin:10px 0; }
#toast { position:fixed; left:50%; bottom:25px; transform:translateX(-50%); background:#291b3b; border:1px solid #ffffff22; padding:12px 17px; border-radius:14px; max-width:90%; z-index:5; text-align:center; }
@media(max-width:520px) {
 .app { padding:11px; }
 #home { padding:20px; }
 .brand { font-size:34px; }
 .topbar { padding:9px; gap:7px; }
 .round { min-width:40px; height:40px; padding:0 9px; }
 #messages { padding:12px 3px; }
 .message { max-width:92%; }
 .composer { gap:6px; padding:8px 4px; }
 .message audio { width:235px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">NiM<span style="color:white">.</span></div>
    <div class="subtitle">Next is Me · parle, partage, connecte-toi.</div>
  </header>

  <section id="home" class="panel">
    <h1>Entre dans NiM ✨</h1>
    <p style="color:var(--muted)">Rejoins tes potes dans un salon.</p>
    <form id="joinForm">
      <label class="field">Ton pseudo
        <input id="nameInput" maxlength="24" placeholder="Ex. Lolo" autocomplete="nickname" required>
      </label>
      <label class="field">Nom du salon
        <input id="roomInput" maxlength="40" placeholder="Ex. potes" value="general" required>
      </label>
      <button class="primary full" type="submit">Entrer dans le salon →</button>
    </form>
    <p class="note">Utilise le même nom de salon que tes amis pour discuter ensemble.</p>
  </section>

  <section id="chat" class="hidden">
    <div class="topbar panel">
      <button id="backButton" class="round" title="Quitter le salon">←</button>
      <div class="room-title"><strong id="roomLabel">Salon</strong><small id="nameLabel"></small></div>
      <button id="callButton" class="round" title="Appel audio">📞</button>
    </div>

    <section id="callPanel" class="panel hidden">
      <strong>📞 Appel audio NiM</strong>
      <div id="callStatus">Prêt à rejoindre l'appel</div>
      <p>Autorise l'accès au micro pour parler avec les membres du salon.</p>
      <div class="call-actions">
        <button id="joinCallButton" class="primary">Rejoindre</button>
        <button id="muteButton" class="round hidden">🎙️ Couper le micro</button>
        <button id="hangupButton" class="round hidden">Raccrocher</button>
      </div>
      <div id="remoteAudios"></div>
    </section>

    <div id="messages" class="panel" aria-live="polite"></div>
    <div id="recordStatus"></div>
    <form id="messageForm" class="composer panel">
      <button type="button" id="photoButton" class="round" title="Envoyer une photo">🖼️</button>
      <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
      <button type="button" id="recordButton" class="round" title="Enregistrer un vocal">🎙️</button>
      <input id="messageInput" maxlength="2000" placeholder="Écris un message…" autocomplete="off">
      <button id="sendButton" class="primary" type="submit" aria-label="Envoyer">➤</button>
    </form>
  </section>
</div>
<div id="toast" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const socket = io();

  let myName = "";
  let myRoom = "";
  let joined = false;
  let recorder = null;
  let recordingChunks = [];
  let recordingTimeout = null;
  let localStream = null;
  let inCall = false;
  let muted = false;
  const peers = new Map();
  const pendingCandidates = new Map();

  function toast(message) {
    const el = $("toast");
    el.textContent = message;
    el.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.add("hidden"), 3000);
  }

  function showChat() {
    $("home").classList.add("hidden");
    $("chat").classList.remove("hidden");
    $("roomLabel").textContent = "#" + myRoom;
    $("nameLabel").textContent = "Connecté en tant que " + myName;
    joined = true;
  }

  function showHome() {
    $("chat").classList.add("hidden");
    $("home").classList.remove("hidden");
    joined = false;
  }

  $("joinForm").addEventListener("submit", (event) => {
    event.preventDefault();
    myName = $("nameInput").value.trim().slice(0, 24);
    myRoom = $("roomInput").value.trim().slice(0, 40);

    if (!myName || !/^[a-zA-Z0-9_-]{1,40}$/.test(myRoom)) {
      toast("Choisis un pseudo et un salon sans espaces ni caractères spéciaux.");
      return;
    }
    socket.emit("join-room", { name: myName, room: myRoom });
  });

  socket.on("connect", () => {
    if (myName && myRoom && !joined) {
      socket.emit("join-room", { name: myName, room: myRoom });
    }
  });

  socket.on("joined", ({ name, room }) => {
    myName = name;
    myRoom = room;
    showChat();
  });

  socket.on("join-error", (message) => toast(message));

  socket.on("history", (history) => {
    $("messages").replaceChildren();
    (history || []).forEach(renderMessage);
    scrollToBottom();
  });

  socket.on("new-message", (message) => {
    renderMessage(message);
    scrollToBottom();
  });

  socket.on("member-left", ({ name }) => {
    // L'info est discrète ; les messages système sont gérés par le serveur.
  });

  function renderMessage(message) {
    if (!message) return;
    const wrapper = document.createElement("div");

    if (message.type === "system") {
      wrapper.className = "system";
      wrapper.textContent = message.text || "";
      $("messages").appendChild(wrapper);
      return;
    }

    wrapper.className = "message" + (message.name === myName ? " mine" : "");

    const meta = document.createElement("div");
    meta.className = "meta";
    const date = new Date(message.time || Date.now());
    meta.textContent = (message.name || "Membre") + " · " +
      date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    wrapper.appendChild(meta);

    if (message.type === "text") {
      const text = document.createElement("div");
      text.className = "body";
      text.textContent = message.text || "";
      wrapper.appendChild(text);
    } else if (message.type === "image" && message.image) {
      const img = document.createElement("img");
      img.src = message.image;
      img.alt = "Photo envoyée dans le chat";
      img.loading = "lazy";
      wrapper.appendChild(img);
    } else if (message.type === "audio" && message.audio) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "metadata";
      audio.src = message.audio;
      audio.setAttribute("playsinline", "");
      audio.addEventListener("error", () => {
        toast("Ce vocal n'est pas lisible par ce navigateur.");
      }, { once: true });
      wrapper.appendChild(audio);
    }

    $("messages").appendChild(wrapper);
  }

  function scrollToBottom() {
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  $("messageForm").addEventListener("submit", (event) => {
    event.preventDefault();
    if (!joined) return;
    const text = $("messageInput").value.trim();
    if (!text) return;
    socket.emit("send-message", { type: "text", text });
    $("messageInput").value = "";
    $("messageInput").focus();
  });

  // Photos envoyées dans le chat uniquement.
  $("photoButton").addEventListener("click", () => $("photoInput").click());

  $("photoInput").addEventListener("change", async () => {
    const file = $("photoInput").files && $("photoInput").files[0];
    $("photoInput").value = "";
    if (!file || !joined) return;
    if (!file.type.startsWith("image/")) {
      toast("Choisis un fichier image.");
      return;
    }

    try {
      const compressed = await compressImage(file);
      if (compressed.length > 740000) {
        toast("La photo est trop lourde. Essaie une image plus petite.");
        return;
      }
      socket.emit("send-message", { type: "image", image: compressed });
    } catch (error) {
      toast("Impossible de préparer cette photo.");
    }
  });

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const maxSide = 1100;
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Vocaux : choisit un format pris en charge par le navigateur.
  $("recordButton").addEventListener("click", async () => {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      return;
    }
    if (!joined) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      toast("L'enregistrement audio n'est pas disponible dans ce navigateur.");
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeCandidates = [
        "audio/mp4",
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus",
        "audio/ogg"
      ];
      const mimeType = mimeCandidates.find((type) =>
        MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)
      );

      recorder = mimeType
        ? new MediaRecorder(stream, { mimeType })
        : new MediaRecorder(stream);

      recordingChunks = [];
      recorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) recordingChunks.push(event.data);
      };

      recorder.onstop = async () => {
        clearTimeout(recordingTimeout);
        $("recordStatus").textContent = "";
        $("recordButton").textContent = "🎙️";
        stream.getTracks().forEach(track => track.stop());

        if (!recordingChunks.length) {
          toast("Le vocal est vide, réessaie.");
          return;
        }

        const type = recorder.mimeType || recordingChunks[0].type || "audio/webm";
        const blob = new Blob(recordingChunks, { type });
        if (blob.size > 550000) {
          toast("Le vocal est trop lourd. Fais un vocal plus court.");
          return;
        }

        try {
          const dataUrl = await blobToDataURL(blob);
          if (dataUrl.length > 740000) {
            toast("Le vocal est trop lourd. Fais un vocal plus court.");
            return;
          }
          socket.emit("send-message", { type: "audio", audio: dataUrl });
        } catch (error) {
          toast("Impossible de préparer le vocal.");
        }
      };

      recorder.start();
      $("recordButton").textContent = "⏹️";
      $("recordStatus").textContent = "🔴 Enregistrement… appuie sur ⏹️ pour envoyer (20 s max)";
      recordingTimeout = setTimeout(() => {
        if (recorder && recorder.state === "recording") recorder.stop();
      }, 20000);
    } catch (error) {
      toast("Autorise le micro dans les paramètres du navigateur.");
    }
  });

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // Appels audio WebRTC : aucune caméra n'est demandée.
  $("callButton").addEventListener("click", () => {
    $("callPanel").classList.toggle("hidden");
  });

  $("joinCallButton").addEventListener("click", joinCall);
  $("hangupButton").addEventListener("click", leaveCall);

  $("muteButton").addEventListener("click", () => {
    if (!localStream) return;
    muted = !muted;
    localStream.getAudioTracks().forEach(track => track.enabled = !muted);
    $("muteButton").textContent = muted ? "🔇 Activer le micro" : "🎙️ Couper le micro";
  });

  async function joinCall() {
    if (inCall) return;
    if (!joined) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("Les appels audio nécessitent l'accès au micro via HTTPS.");
      return;
    }

    $("joinCallButton").disabled = true;
    $("callStatus").textContent = "Connexion au micro…";

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });
      inCall = true;
      muted = false;
      $("joinCallButton").classList.add("hidden");
      $("muteButton").classList.remove("hidden");
      $("hangupButton").classList.remove("hidden");
      $("callStatus").textContent = "Connexion à l'appel audio…";
      socket.emit("voice-join");
    } catch (error) {
      $("callStatus").textContent = "Micro indisponible.";
      toast("Autorise le micro dans les paramètres du navigateur.");
    } finally {
      $("joinCallButton").disabled = false;
    }
  }

  function makePeer(peerId) {
    if (peers.has(peerId)) return peers.get(peerId);

    const pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
      ]
    });

    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        socket.emit("voice-signal", {
          to: peerId,
          signal: { candidate: event.candidate }
        });
      }
    };

    pc.ontrack = (event) => {
      let audio = document.getElementById("remote-" + peerId);
      if (!audio) {
        audio = document.createElement("audio");
        audio.id = "remote-" + peerId;
        audio.autoplay = true;
        audio.controls = true;
        audio.setAttribute("playsinline", "");
        audio.style.display = "block";
        audio.style.width = "100%";
        audio.style.marginTop = "8px";
        $("remoteAudios").appendChild(audio);
      }
      if (event.streams && event.streams[0]) {
        audio.srcObject = event.streams[0];
        audio.play().catch(() => {
          $("callStatus").textContent = "Appuie sur lecture si le son ne démarre pas.";
        });
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") {
        $("callStatus").textContent = "🟢 Appel audio connecté";
      } else if (pc.connectionState === "failed") {
        $("callStatus").textContent = "Connexion impossible sur ce réseau.";
      }
    };

    pc.oniceconnectionstatechange = () => {
      if (pc.iceConnectionState === "failed") {
        $("callStatus").textContent = "Échec réseau. Un serveur TURN peut être nécessaire.";
      }
    };

    peers.set(peerId, pc);
    pendingCandidates.set(peerId, []);
    return pc;
  }

  async function createOffer(peerId) {
    try {
      const pc = makePeer(peerId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("voice-signal", {
        to: peerId,
        signal: { description: pc.localDescription }
      });
    } catch (error) {
      console.error("Erreur offre audio :", error);
    }
  }

  socket.on("voice-peers", async (peerIds) => {
    if (!inCall) return;
    for (const peerId of peerIds || []) {
      await createOffer(peerId);
    }
    if (!peerIds || peerIds.length === 0) {
      $("callStatus").textContent = "Tu es dans l'appel. En attente des autres…";
    }
  });

  socket.on("voice-peer-joined", () => {
    if (inCall) $("callStatus").textContent = "Un membre rejoint l'appel…";
  });

  socket.on("voice-signal", async ({ from, signal }) => {
    if (!inCall || !from || !signal) return;

    try {
      const pc = makePeer(from);

      if (signal.description) {
        await pc.setRemoteDescription(signal.description);

        const queued = pendingCandidates.get(from) || [];
        for (const candidate of
